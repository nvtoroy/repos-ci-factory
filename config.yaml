# CI-фабрика: отслеживаемые репозитории.
# Добавить репозиторий = добавить блок в `repos:`. Сборка произойдёт на следующем
# дневном тике check.yml (или сразу: gh workflow run check.yml -f force=<name>).
defaults:
  max_direct_mb: 45          # артефакт больше этого — уходит в GitHub Release, в канал ссылка

repos:
  - name: newpipe                        # ключ в state.json и в force=
    repo: TeamNewPipe/NewPipe
    display: NewPipe
    platform: android                    # -> .github/workflows/build-android.yml
    trigger:
      mode: branch                       # branch | release | tag
      branch: dev
    build:
      java: "21"
      gradle_task: ":app:assembleRelease"
      # {date} -> UTC yyyymmdd, {datehour} -> UTC yyyymmddHH (монотонный versionCode)
      gradle_args: "-DpackageSuffix=my -DversionNameSuffix=-my-{date} -DversionCodeOverride={datehour}"
      # апстрим формирует имя "NewPipe $suffix" (с пробелом) — убираем пробел: "NewPipe.my"
      pre_build: |
        sed -i 's/NewPipe $suffix/NewPipe.$suffix/' app/build.gradle.kts
      # платформу (compileSdk) AGP докачивает сам, как в апстрим-CI; ставим только build-tools для подписи
      sdk_packages: ["build-tools;35.0.1"]
      build_tools: "35.0.1"
    artifact:
      glob: "app/build/outputs/apk/release/*.apk"
      name: "NewPipe-{version}-{sha7}.apk"
    telegram: {}

  - name: bitchat-android
    repo: permissionlesstech/bitchat-android
    display: bitchat (Android)
    platform: android
    trigger:
      mode: branch
      branch: main
    build:
      java: "17"
      # packageRelease вместо assembleRelease: у проекта авто-сплиты по ABI на assemble*,
      # а packageRelease даёт один универсальный APK (~46 МБ)
      gradle_task: ":app:packageRelease"
      gradle_args: ""
      # versionCode/versionName захардкожены в build.gradle.kts — патчим датой,
      # чтобы обновления вставали поверх и версия была видна
      pre_build: |
        sed -i -E 's/versionCode = [0-9]+/versionCode = {datehour}/' app/build.gradle.kts
        sed -i -E 's/versionName = "([^"]+)"/versionName = "\1-my-{date}"/' app/build.gradle.kts
        # фикс краша на старте: R8 на их main срезает конструктор WorkDatabase_Impl
        # (регрессия после бампа AGP 9.3.1; их CI приложение не запускает и не видит этого)
        echo '-keep class * extends androidx.room.RoomDatabase { <init>(); }' >> app/proguard-rules.pro
      sdk_packages: ["build-tools;35.0.1"]
      build_tools: "35.0.1"
    artifact:
      glob: "app/build/outputs/apk/release/*.apk"
      name: "bitchat-android-{version}-{sha7}.apk"
    telegram:
      max_direct_mb: 49        # универсальный APK ~46 МБ — чуть выше общего порога 45

  - name: bitchat
    repo: permissionlesstech/bitchat
    display: bitchat
    platform: macos                      # -> .github/workflows/build-macos.yml
    trigger:
      mode: branch
      branch: main
    build:
      xcode: "26"                        # glob /Applications/Xcode_26*.app, берётся новейший
      project: bitchat.xcodeproj
      scheme: "bitchat (macOS)"
      configuration: Release
      archs: "arm64 x86_64"
      product: bitchat.app
      entitlements_keep:                 # ad-hoc подпись: app-groups выброшен намеренно
        - com.apple.security.app-sandbox
        - com.apple.security.network.client
        - com.apple.security.network.server
        - com.apple.security.device.bluetooth
    artifact:
      name: "bitchat-macos-{version}-{sha7}.zip"
    telegram:
      note: "Первый запуск: правый клик -> Открыть (или: xattr -d com.apple.quarantine bitchat.app)"
